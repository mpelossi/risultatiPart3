policy_name: vips-first-parallel
memcached:
  node: node-b-4core
  cores: '0'
  threads: 1
jobs:
  vips:
    node: node-a-8core
    cores: 0-7
    threads: 8
    after: start
  barnes:
    node: node-a-8core
    cores: 0-3
    threads: 4
    after: vips
  streamcluster:
    node: node-a-8core
    cores: 4-7
    threads: 4
    after: vips
  freqmine:
    node: node-a-8core
    cores: 0-3
    threads: 4
    after: barnes
  radix:
    node: node-a-8core
    cores: 4-7
    threads: 4
    after: streamcluster
  canneal:
    node: node-b-4core
    cores: 1-3
    threads: 3
    after: start
  blackscholes:
    node: node-b-4core
    cores: 1-3
    threads: 3
    after: canneal
