policy_name: parallel-8core-optimized
memcached:
  node: node-b-4core
  cores: '0'
  threads: 1
jobs:
  canneal:
    node: node-b-4core
    cores: 1-3
    threads: 3
    after: start
  freqmine:
    node: node-a-8core
    cores: 0-7
    threads: 8
    after: start
  barnes:
    node: node-a-8core
    cores: 0-3
    threads: 4
    after: freqmine
  vips:
    node: node-a-8core
    cores: 4-7
    threads: 4
    after: freqmine
  streamcluster:
    node: node-a-8core
    cores: 0-3
    threads: 4
    after: barnes
  blackscholes:
    node: node-a-8core
    cores: 4-7
    threads: 4
    after: vips
  radix:
    node: node-a-8core
    cores: 0-3
    threads: 4
    after: streamcluster
